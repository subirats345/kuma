name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: swift build
      - name: Smoke CLI
        run: |
          mkdir -p .build/cli
          .build/debug/kuma --help
          .build/debug/kuma init .build/cli/starter.md
          .build/debug/kuma .build/cli/starter.md .build/cli/starter.pdf
          test -s .build/cli/starter.pdf
          mkdir -p .build/interactive
          cp Examples/basic.md .build/interactive/basic.md
          (
            cd .build/interactive
            printf '1\n\nn\nn\n' | ../../.build/debug/kuma
            test -s basic.pdf
          )
          .build/debug/kuma watch .build/cli/starter.md .build/cli/watch.pdf > .build/cli/watch.log 2>&1 &
          pid=$!
          sleep 2
          test -s .build/cli/watch.pdf
          printf '\nchanged\n' >> .build/cli/starter.md
          sleep 3
          grep -q "Rendered" .build/cli/watch.log
          kill "$pid"
          wait "$pid" 2>/dev/null || true
      - name: Smoke render examples
        run: |
          mkdir -p .build/examples
          for md in Examples/*.md; do
            name=$(basename "$md" .md)
            .build/debug/kuma "$md" ".build/examples/$name.pdf"
            test -s ".build/examples/$name.pdf"
          done
      - name: Validate Codex skill
        run: |
          test -s skills/kuma-pdf/SKILL.md
          grep -q '^name: kuma-pdf$' skills/kuma-pdf/SKILL.md
          test -x skills/kuma-pdf/scripts/render-preview.sh
          KUMA_SKIP_PREVIEW=1 PATH="$PWD/.build/debug:$PATH" skills/kuma-pdf/scripts/render-preview.sh Examples/basic.md .build/skill/basic.pdf .build/skill
          test -s .build/skill/basic.pdf
